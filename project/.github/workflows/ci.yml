name: CI - Build and Lint

on:
  push:
    branches:
      - master
      - github-actions-learning
  pull_request:
    branches:
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: read

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Automatically caches npm dependencies

      - name: Install dependencies
        run: npm ci # Uses package-lock.json for clean, reproducible installs

      - name: Run lint
        run: npm run lint

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint # Only run build if linting passes successfully
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build
